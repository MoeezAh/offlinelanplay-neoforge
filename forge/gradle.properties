## =============================================================================
## PROJECT-LEVEL gradle.properties — FORGE (MinecraftForge)
## Only Forge-specific properties belong here.
## Global/shared properties (minecraft_version, mod_id, mod_version, ...) live
## in the root gradle.properties and are inherited automatically.
## =============================================================================

# Forge version for Minecraft 1.20.2
forge_version=48.1.0
forge_version_range=[48,)

# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[39,)

# Pack version for pack.mcmeta - this changes each Minecraft release, in general.
# (Expanded into pack.mcmeta by the processResources task.)
pack_format_number=18
