modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
logoFile="logo.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
displayURL="https://github.com/MoeezAh/offlinelanplay-neoforge/issues"
credits = "${mod_credits}" #optional
authors="${mod_authors}"
description='''${mod_description}'''

# Register the mixin config with Forge's built-in Mixin integration.
# Without this, a production jar never loads offlinelanplay.mixins.json
# (in dev it only appeared to work because of the run-config property).
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
