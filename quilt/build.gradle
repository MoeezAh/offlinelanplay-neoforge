plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'org.quiltmc.loom' version '1.8.5'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-quilt-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        name = "QuiltMC Maven"
        url = "https://maven.quiltmc.org/repository/release/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "org.quiltmc:quilt-loader:${quilt_loader_version}"

    // Quilt Standard Libraries (QSL / quilt_base) — REQUIRED at compile time,
    // because the 'init' entrypoint on Quilt Loader must implement
    // org.quiltmc.qsl.base.api.entrypoint.ModInitializer. At runtime QSL ships
    // bundled inside Quilted Fabric API, so the built jar still works whether or
    // not the user has QFAPI/QSL installed (the mod declares no hard dependency).
    modImplementation "org.quiltmc.qsl.core:qsl_base:${qsl_version}"

    // Quilted Fabric API (QFAPI) — provides the Fabric compatibility layer.
    // This mod does not call any QFAPI features itself, so it is an OPTIONAL
    // runtime dep; uncomment below to test against it in a dev environment:
    // modLocalRuntime "org.quiltmc.quilted-fabric-api:quilted-fabric-api:${qfapi_version}"
}

processResources {
    var replaceProperties = [
            mod_id                  : mod_id, 
            mod_name                : mod_name, 
            mod_license             : mod_license, 
            mod_version             : mod_version,
            mod_authors             : mod_authors, 
            mod_description         : mod_description,
            mod_group_id            : mod_group_id,
            minecraft_version       : minecraft_version,
    ]
    inputs.properties replaceProperties

    filesMatching('quilt.mod.json') {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('remapJar') {
    // Prevent the inherited Jar copy action from clobbering the remapped output
    // by pointing the (unused) source set at the remapped result location and
    // re-writing the jar after the task finishes if it was emptied.
    doLast {
        def lib = archiveFile.get().asFile
        def dev = file("${buildDir}/devlibs/${archiveBaseName.get()}-${archiveVersion.get()}-dev.jar")
        if (lib.length() < 1024 && dev.exists()) {
            logger.lifecycle("Repairing remapped jar (Quilt Loom copy-action bug)")
            ant.copy(file: dev, tofile: lib, overwrite: true)
        }
    }
}