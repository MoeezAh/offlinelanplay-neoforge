## =============================================================================
## PROJECT-LEVEL gradle.properties — QUILT
## Only Quilt-specific properties belong here.
## Global/shared properties (minecraft_version, mod_id, mod_version, ...) live
## in the root gradle.properties and are inherited automatically.
## =============================================================================

# Quilt Loader version for Minecraft 1.20.2
quilt_loader_version=0.24.0

# Quilt Standard Libraries (QSL) version for Minecraft 1.20.2 (compile-time only, for the quilt_base ModInitializer interface)
qsl_version=7.0.0-alpha.13+1.20.2

# Quilted Fabric API (QFAPI) version for Minecraft 1.20.2 (bundles QSL; optional runtime compatibility layer)
qfapi_version=8.0.0-alpha.6+0.91.6-1.20.2

# Pack version for pack.mcmeta - this changes each Minecraft release, in general.
pack_format_number=18
