## =============================================================================
## PROJECT-LEVEL gradle.properties — NEOFORGE
## Only NeoForge-specific properties belong here.
## Global/shared properties (minecraft_version, mod_id, mod_version, ...) live
## in the root gradle.properties and are inherited automatically.
## =============================================================================

# Read more on this at https://github.com/neoforged/NeoGradle/blob/NG_7.0/README.md#apply-parchment-mappings
# You can find the latest versions here: https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.20.2
neogradle.subsystems.parchment.mappingsVersion=2023.12.10

# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=20.2.93
# The Neo version range can use any version of Neo as bounds or match the loader version range
neo_version_range=[20.2,)
# The loader version range can only use the major version of Neo/FML as bounds
loader_version_range=[1,)

# Pack version for pack.mcmeta - this changes each Minecraft release, in general.
pack_format_number=18
